name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile main2_collision_free.py matlab_bridge.py test_matlab_bridge.py test_obstacle_normalization.py
      - run: python test_matlab_bridge.py
      - run: python test_obstacle_normalization.py
